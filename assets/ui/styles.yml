# Thème global raygui, par composant ("Default" s'applique à tous)
# Palette tirée de tds-modern-gui-pixel-art : fonds quasi noirs, bordures olive, texte or, coins carrés.
Theme:
  Default:
    TextSize: 16
    TextSpacing: 1
    BorderWidth: 2
    Radius: 0
    BorderColor: "#594c29"
    BaseColor: "#181715"
    TextColor: "#9a7a25"
    BorderColorFocused: "#9a7a25"
    BaseColorFocused: "#1f1e1d"
    TextColorFocused: "#c49943"
    BorderColorPressed: "#c49943"
    BaseColorPressed: "#39311a"
    TextColorPressed: "#ffffff"
    BorderColorDisabled: "#302b27"
    BaseColorDisabled: "#141312"
    TextColorDisabled: "#463c20"
    BackgroundColor: "#181716"
    LineColor: "#594c29"
  # Barres (Settings/Bar BG.png + Bar.png) : fond creusé, remplissage or
  Slider:
    BaseColor: "#110f0b"
    BaseColorFocused: "#16130e"
    BaseColorPressed: "#ac8435"
  ProgressBar:
    BaseColor: "#110f0b"
    BaseColorPressed: "#ac8435"
  # Case à cocher (Settings/Checkbox 01.png), coche blanche comme Mark.png
  CheckBox:
    BaseColor: "#352e1c"
    BorderColor: "#594c29"
  # Champs de saisie : plus sombres que les boutons
  TextBox:
    BaseColor: "#121110"
    BaseColorFocused: "#121110"
    BaseColorPressed: "#121110"
    TextColor: "#c49943"
  ValueBox:
    BaseColor: "#121110"
    BaseColorPressed: "#121110"
    TextColor: "#c49943"
  StatusBar:
    BaseColor: "#121110"
    TextColor: "#9a7a25"

# Styles nommés, référencés par la clé "Style" des éléments
Styles:
  Header:
    TextSize: 28
    TextColor: "#ffffff"
  Footer:
    TextSize: 10
    TextColor: "#594c29"
  Gold:
    TextColor: "#c49943"
